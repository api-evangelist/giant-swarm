aid: giant-swarm

name: Giant Swarm

description: Giant Swarm offers a curated, managed platform engineering stack built on Kubernetes, providing battle-tested components for fleet management, observability, security, networking, connectivity, a developer portal, AI/agent platforms and application management across hybrid and multi-cloud environments. Its documentation covers getting started guides, tutorials, an API and CLI reference, support and training, and changes and releases.

