apis:
- aid: giant-swarm:platform-api
  name: Giant Swarm Platform API
  description: Giant Swarm's platform API is a Kubernetes API that operates on each customer management cluster, offering custom resources (Cluster API clusters, App Platform apps, catalogs, policies) to create and update workload clusters and deploy applications, accessed via kubectl with the kubectl-gs plugin, GitOps (Flux) or the developer portal. Each management cluster has its own API endpoint, https://api.<management cluster base domain>/, provided by Giant Swarm.
  humanURL: https://docs.giantswarm.io/getting-started/access-to-platform-api/
  baseURL: https://api.{managementClusterBaseDomain}/
  tags:
  - Kubernetes
  - Platform Engineering
  properties:
  - type: Documentation
    url: https://docs.giantswarm.io/getting-started/access-to-platform-api/
  - type: APIReference
    url: https://docs.giantswarm.io/reference/platform-api/
  - type: Authentication
    url: https://docs.giantswarm.io/tutorials/access-management/authentication/user/
  - type: GitHubRepository
    url: https://github.com/giantswarm/apiextensions-application
- aid: giant-swarm:observability-platform-api
  name: Giant Swarm Observability Platform API
  description: The Giant Swarm Observability Platform API imports and exports metrics, logs and traces through upstream-compatible endpoints (Prometheus remote write and query API, Loki push and query API, Tempo/OTLP) on a shared per-installation host https://observability.<domain_name>, authenticated with an OIDC bearer token plus an X-Scope-OrgID tenant header; it must be enabled for an installation by the Account Engineer.
  humanURL: https://docs.giantswarm.io/overview/observability/data-management/data-import-export/observability-platform-api/
  baseURL: https://observability.{domain_name}
  tags:
  - Observability
  properties:
  - type: Documentation
    url: https://docs.giantswarm.io/overview/observability/data-management/data-import-export/observability-platform-api/

