source: https://www.giantswarm.io/privacy-policy
description: >-
  Horizontal regulatory signals HARVESTED from what Giant Swarm GmbH (Cologne, Germany)
  publishes; nothing here decides which regime applies. The only legal page on the site is the
  combined "Terms & Privacy" page at /privacy-policy (GDPR-framed). It lists data subject rights
  with a contact, and gives retention statements. Probed 2026-10-18 on www.giantswarm.io:
  /imprint, /legal, /legal/subprocessors, /legal/dpa, /subprocessors, /dpa, /accessibility,
  /trust, /security, /transparency, /terms and /ai all returned 404 (redirected under /blog/). No
  subprocessor list, DPA, accessibility statement, SBOM, transparency report, AI-transparency
  page or data-residency page was found. The docs pages on workload cluster releases and cluster
  upgrades (docs.giantswarm.io) state no support period. The policy names Google Analytics and
  HubSpot as website "cookie suppliers" acting as data processors, but this is not a
  subprocessor list for the product, so no subprocessors signal is recorded. Its only opt-out
  mechanism is the browser "do-not-track" option, and it does not mention Global Privacy
  Control, so no GPC signal is recorded.
signals:
